# ============================================================
# MLSecOps Agent — Configuration
# ============================================================
# Override any value via environment variable with prefix MLSEC_
# Example: MLSEC_MODEL=gemma2:9b  overrides  model below
# ============================================================

# --- LLM Configuration ---
llm:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "huihui_ai/qwen3.5-abliterated:9b"
  temperature: 0.1
  num_gpu: 0  # 0 = Chạy an toàn trên CPU để tránh lỗi CUDA PTX JIT crash trên NVIDIA Driver 592.82/GPU 4GB
  num_ctx: 16384                   # Cửa sổ ngữ cảnh cho Red Teamer (tránh tràn token khi tool output lớn)
  num_predict: 8192                # Giới hạn token sinh tối đa mỗi bước
  keep_alive: "15m"                # Duy trì mô hình trong RAM/VRAM tránh tráo đổi (swap) gây chậm real-time

# --- Agent Orchestrator ---
agent:
  max_iterations: 25               # Max ReAct loop iterations per session
  context_window_size: 30           # Keep last N messages; older ones get summarized
  retry_max: 2                      # Auto-retry on MCP/tool failure
  retry_delay_seconds: 3            # Delay between retries
  stagnation_warning_threshold: 3   # Consecutive steps without new findings before warning
  stagnation_max_threshold: 5       # Consecutive steps without new findings before forced final_answer
  relentless_pursuit: true          # Chế độ nỗ lực cực đoan - kiên quyết theo đuổi mục tiêu
  compound_threat_correlation: true # Động cơ tương quan lỗ hổng phức hợp (8 chuỗi khai thác)
  max_guard_challenges: 10          # Số lần tối đa chặn kết thúc sớm khi còn vector khả thi (Cực đoan)
  stagnation_max_rescues: 5         # Số lần tối đa giải cứu bế tắc tự động nạp đòn đột phá (Cực đoan)
  frontier_reasoning: true          # Bật kiến trúc nhận thức đa tầng (Claude 3.7 & GPT-5 Style)
  cognitive_scratchpad: true        # Bộ nhớ làm việc bền vững chống mất trí nhớ ngữ cảnh
  tree_of_thought: true             # Cây giả thuyết tấn công với cơ chế quay lui (Backtracking) tự động
  skeptic_critic: true              # Bộ lọc phản biện loại trừ false-positive (Soft-404, Encoded XSS)
  defense_evasion: true             # Tự động nhận diện WAF (Cloudflare/ModSec) và né tránh phòng thủ

# --- MCP Server ---
mcp:
  server_script: "src/servers/docker_arsenal.py"

# --- Tool Timeouts (seconds) ---
timeouts:
  fast_scan: 120
  deep_scan: 300
  nuclei: 300
  sqlmap: 300
  crawler: 60
  hydra: 600
  metasploit: 180
  whatweb: 60
  nikto: 240
  gobuster: 120
  wpscan: 300
  subfinder: 120
  ffuf: 180
  testssl: 300
  sensitive_files: 60
  cors: 60
  xss: 120
  httpx: 120
  ssl_cert: 30
  dns_security: 30
  security_txt: 30
  cookie_security: 30
  http_headers: 30
  api_docs: 60
  subdomain_takeover: 60
  waf_detect: 30

# --- Human-in-the-Loop ---
hitl:
  enabled: true
  destructive_tools:
    - docker_sqlmap_scan
    - docker_sqlmap_dump
    - docker_bruteforce
    - bruteforce_ssh
    - bruteforce_http_form
    - docker_wpscan
    - docker_msf_search

# --- Reporter Agent (SOC Analyst — Real-time Collaboration) ---
reporter:
  model: "huihui_ai/qwen3.5-abliterated:2B"           # Con 2B Abliterated nhẹ, không kiểm duyệt, chạy trên CPU/RAM
  temperature: 0.3               # Văn phong chuẩn xác, không bay bổng
  timeout_seconds: 120           # Timeout cho Final Polish pass (giây)
  enabled: true                  # false = tắt Reporter hoàn toàn
  realtime: true                 # true = quan sát real-time mỗi bước; false = chỉ chạy cuối
  realtime_timeout: 30           # Timeout cho mỗi lần gọi real-time (giây)
  num_ctx: 8192                  # Cửa sổ ngữ cảnh cho Reporter (đủ cho summary + tool output)
  num_predict: 2048              # Giới hạn token sinh tối đa cho Reporter
  keep_alive: "15m"              # Giữ mô hình trong RAM/VRAM đồng thời với Red Teamer
  skip_tools:                    # Không gọi Reporter cho các tool nhẹ này
    - docker_resolve_dns
    - browse_webpage

# --- Reporting (Multi-Format: DOCX, Markdown, JSON, HTML) ---
reports:
  output_dir: "reports"
  generate_word: true
  generate_markdown: true
  generate_json: true
  generate_html: true
  company_name: "Security Assessment Team"
  classification: "CONFIDENTIAL"

# --- Wordlists ---
wordlists:
  directory: "wordlists"
  default_password: "rockyou.txt"
  default_directory: "dirb_common.txt"

# --- Vector Database & RAG Long-term Memory (Tactical Self-Learning) ---
vectordb:
  enabled: true
  path: "data/chromadb"
  embedding_source: "ollama"        # "ollama" (nomic-embed-text) hoặc "onnx" (MiniLM fallback)
  ollama_model: "nomic-embed-text"  # 768d, 8K context, ~137MB
  top_k: 3                         # Số kịch bản tối đa trả về mỗi query
  min_similarity: 0.65             # Ngưỡng cosine similarity tối thiểu
  max_rag_tokens: 800              # Token budget cho RAG block
  rerank:
    enabled: true
    model: "ms-marco-MiniLM-L-12-v2"  # FlashRank ONNX (~34MB)
    weights:                          # Trọng số final score
      cross_encoder: 0.5
      heuristic: 0.3
      vector_similarity: 0.2
  consolidation:
    auto_trigger_threshold: 1000    # Tự động consolidate khi > N records
    similarity_threshold: 0.85     # Ngưỡng gộp nhóm
    min_cluster_size: 5            # Ít nhất N bản ghi giống nhau mới gộp

# --- Tactical Policy Engine (Reinforcement Learning & Bandit Hybrid) ---
tactical_policy:
  enabled: true
  policy_file: "data/tactical_policy.json"
  learning_rate: 0.15
  discount_factor: 0.85
  exploration_bonus: 1.2


